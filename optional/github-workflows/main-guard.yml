# MAIN GUARD — the one check GitHub still runs on code, and the reason it exists.
#
# Every other pull_request check moved into `npm run preflight`, which the agent session runs on
# the same commit minutes before pushing. Re-running them on GitHub was paying twice for one
# answer, and on a private repository those minutes are metered.
#
# This one cannot move, and it is not a duplicate of preflight:
#
#   A squash merge produces a tree that NO pull request run ever tested. Two PRs that are each
#   green can produce a broken `main` between them. That is exactly when a silent breakage lands,
#   and there is no agent session alive at merge time to notice.
#
# So: nothing on pull_request, everything on `main` after the squash, on a clean machine.
name: main guard

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Only the newest `main` matters. Cancel a superseded run rather than pay for it.
  group: main-guard
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A docs-only merge cannot break the build. Short-circuit INSIDE the job, never with
      # paths-ignore at the top of the file: a filtered-out workflow never reports at all, and a
      # check that does not report is indistinguishable from one that has not finished.
      - name: Is there any code in this merge?
        id: scope
        run: |
          changed=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null || git diff --name-only HEAD~1 HEAD)
          echo "$changed" | sed 's/^/  /'
          if echo "$changed" | grep -qvE '^(docs/|.*\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "docs-only merge — the suite is skipped, and this check still reports."
          fi

      # .nvmrc when the repo has one, otherwise the version this workflow was written against.
      # Hard-wiring node-version-file fails the whole guard in a repo that never adopted .nvmrc.
      - name: Pick the node version
        if: steps.scope.outputs.code == 'true'
        id: node
        run: |
          if [ -f .nvmrc ]; then
            echo "version=$(tr -d 'v \n' < .nvmrc)" >> "$GITHUB_OUTPUT"
          else
            echo "version=22" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.code == 'true'
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - name: Install
        if: steps.scope.outputs.code == 'true'
        run: npm ci --no-audit --no-fund

      # --full, and that flag is the point.
      #
      # `npm run preflight` skips the slow browser suites by default, because a session runs it
      # before every push and a browser build there would cost minutes on every iteration. That
      # made this the ONLY automatic venue for them once the per-PR workflows were demoted — and
      # the first version of this file ran bare `npm run preflight`, which meant the browser proof
      # ran nowhere at all. A fresh critic caught it; the flag is the fix.
      #
      # Once per merge, on a clean machine, against the squashed tree nobody has tested yet.
      # THE TWO THINGS `--full` NEEDS, AND BOTH ARE PORTS RATHER THAN INVENTIONS.
      #
      # This guard absorbed the browser suites from the workflows WORKFLOW-P36 demoted — but it took
      # their COMMANDS without the two setup steps that made those commands survivable. Measured
      # 2026-08-27: main-guard had never passed on either repo since the day it was written.
      #
      #   1. THE BROWSER. Every workflow that drove a browser installed one first — five of them in
      #      pp-workspace (`proof-baseline`, `proof-live`, `canvas-proof`, `lnp-live-proof`,
      #      `nightly-health`) and `pb-foundation-ci` in pp-shopify-theme. The theme's
      #      `test:pb-fresh-open-presentation` died in 0.7 s on `browserType.launch: Executable
      #      doesn't exist`. Reproduced locally; the launch clears once a browser is present.
      #
      #   2. THE HEAP. `npm run proof` builds the app twice, and that build sits within a few tens
      #      of megabytes of Node's default ~2 GB heap on this runner. `proof-baseline.yml` has
      #      carried `--max-old-space-size=4096` for weeks with the diagnosis written beside it.
      #      Without it, runs 6 and 8 both died `FATAL ERROR: Ineffective mark-compacts near heap
      #      limit` ~11 minutes in, on unrelated diffs — one a feature slice, one docs plus a
      #      checker. In pp-workspace the OOM hit during the BUILD, which meant the missing browser
      #      was hidden behind it: fixing only the heap would have moved the failure one step, not
      #      removed it.
      #
      # Both settings are harmless where they are not needed — a repo whose `--full` drives no
      # browser pays ~30 s once per merge, and a larger heap ceiling is a ceiling, not a reservation.
      # That is what lets one kit-owned file serve both repos.
      #
      # The shape of the bug is worth more than the fix: a guard that cannot start has tested
      # nothing, and it reports as if the code were broken — which is worse than not running,
      # because it looks like a verdict.
      - name: Install the browser the slow suites drive
        if: steps.scope.outputs.code == 'true'
        run: npx playwright install --with-deps chromium

      # THE KEY, AND WHY ITS ABSENCE WAS WORSE THAN A FAILING TEST (WORKFLOW-P40).
      #
      # Measured on commit 79922f9 — the same tree, the same command, a clean checkout: the agent
      # session reported 0 failures and this guard reported 5. FOUR of the five were one line,
      # `SUPABASE_SERVICE_ROLE_KEY missing`, from suites that read the live chain rows. The
      # session had the key in `.env.local`; this step was never given it.
      #
      # That is the most expensive kind of red there is. It is not a broken build, it looks
      # exactly like one, and the fix everyone reaches for after a week of it is to stop believing
      # the guard. The key is already a secret this repository holds — `ralph-continue-on-merge`
      # passes it to four steps, and the spend meter below already reads it here.
      #
      # `preflight.mjs` carries the other half: those four suites now declare `needsEnv`, so a
      # machine that genuinely has no key says "could not start" and names what it wants, instead
      # of reporting a defect that does not exist.
      #
      # `--require-secrets` IS LOAD-BEARING AND IS NOT BELT AND BRACES.
      #
      # "Could not start" gates nothing. Without this flag, the very condition above — no key on
      # this runner — would turn a loud five-failure red into four quiet lines inside a GREEN run,
      # on the ONLY venue that ever tests the squashed tree. `${{ secrets.X }}` renders as the
      # empty string when the secret is missing, renamed, rotated to blank, or simply never
      # created in the next repository to install this file. Every one of those would then be
      # indistinguishable from a clean pass.
      #
      # The flag says: this machine was promised the secrets, so a missing one is a failure that
      # names the secret. A developer's laptop does not pass it and stays quiet, because nobody
      # there can fix a credential they were never meant to hold.
      - name: Preflight on the merged tree — everything, including the slow suites
        if: steps.scope.outputs.code == 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run preflight -- --full --require-secrets

      # The CI spend meter. It reads the billing API and needs secrets that exist only here, so
      # unlike the test suites it genuinely cannot move into the agent session. Optional: repos
      # without the script skip it rather than fail. continue-on-error — a measurement must never
      # be able to fail the guard it is measuring.
      - name: Refresh the CI spend ceiling
        if: steps.scope.outputs.code == 'true' && hashFiles('scripts/afkf-ci-ceiling.mjs') != ''
        continue-on-error: true
        env:
          AFKF_CI_PAT: ${{ secrets.AFKF_CI_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/afkf-ci-ceiling.mjs --refresh
