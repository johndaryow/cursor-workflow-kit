# WORKFLOW-P17/P18 — Primary AFK chain engine.
# PR merged to main → reconcile STATUS → plan next slice → launch Cloud Agent.
# Cursor Automations merge trigger stays OFF (duplicate / unreliable secrets).
#
# Manual fallback:
#   gh workflow run ralph-continue-on-merge.yml -f pr_number=<n>
#   npm run mc:ralph-launch -- --pr-number <n>

name: Ralph continue on merge

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Merged PR number (manual Ralph launch)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

jobs:
  ralph-launch:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve PR number
        id: pr
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Reconcile STATUS on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MC_STATUS_RECONCILE_PUSH: '1'
        run: node scripts/mc-status-reconcile.mjs --pr-number "${{ steps.pr.outputs.number }}"

      - name: Plan next slice
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ralph-chain.mjs --pr-number "${{ steps.pr.outputs.number }}"

      - name: Launch next Cloud Agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_CLOUD_ENV_NAME: ${{ secrets.CURSOR_CLOUD_ENV_NAME }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ralph-chain-launch.mjs --pr-number "${{ steps.pr.outputs.number }}"
